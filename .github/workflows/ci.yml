name: CI

on:
  push:
    branches: [ package ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test

      # The product README makes this a release gate: CI runs the same clean
      # generation and build a builder would, from public inputs only. A unit
      # suite that never generates an app cannot see a broken template.
      - name: Generate a fixture app from a clean checkout
        run: |
          node bin/create-fidj.cjs "$RUNNER_TEMP/ci-fixture" \
            --app-id fidj-ci-fixture \
            --api-endpoint https://api.sandbox.fidj.ovh/v3 \
            --title "CI Fixture" \
            --welcome "Generated by CI" \
            --anonymous false
      - name: Build what was generated
        working-directory: ${{ runner.temp }}/ci-fixture
        run: |
          npm install --no-audit --no-fund
          npm run build

      # No build step for the generator itself: it ships its sources, so it
      # publishes from the repository root rather than from a dist directory
      # like the other packages.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
